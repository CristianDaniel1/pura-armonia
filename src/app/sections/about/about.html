<section id="about" class="section overflow-hidden">
  <div class="container-page grid items-center gap-16 lg:grid-cols-2 lg:gap-20">
    <!-- Foto oficial -->
    <figure appReveal class="relative mx-auto w-full max-w-md lg:max-w-none">
      <div
        class="absolute -inset-3 translate-x-3 translate-y-3 rounded-[28px] border border-gold/40 sm:-inset-4 sm:translate-x-6 sm:translate-y-6"
        aria-hidden="true"
      ></div>
      <div class="relative overflow-hidden rounded-3xl bg-ivory shadow-2xl shadow-black/60">
        <img
          src="images/band.jpg"
          [alt]="t().about.photoAlt"
          width="900"
          height="900"
          loading="lazy"
          class="aspect-square w-full object-cover"
        />
      </div>
      <figcaption
        class="absolute -bottom-6 left-6 rounded-2xl border border-line bg-surface/90 px-5 py-4 backdrop-blur-md sm:left-10"
      >
        <span class="block font-script text-3xl leading-none text-wine-bright">con sabor</span>
        <span class="mt-1 block text-xs font-bold tracking-[0.25em] text-gold uppercase"
          >São Paulo · Brasil</span
        >
      </figcaption>
    </figure>

    <!-- Texto -->
    <div>
      <app-section-heading [eyebrow]="t().about.eyebrow" [title]="t().about.title" />

      <div appReveal="100" class="space-y-5 text-lg text-muted">
        <p>{{ t().about.p1 }}</p>
        <p>{{ t().about.p2 }}</p>
      </div>

      <dl appReveal="200" class="mt-12 grid grid-cols-3 divide-x divide-line border-y border-line">
        @for (stat of t().about.stats; track stat.label) {
          <div class="flex flex-col-reverse justify-end px-2 py-6 text-center">
            <dt class="mt-3 text-xs leading-snug tracking-wider text-dim uppercase">
              {{ stat.label }}
            </dt>
            <dd class="font-display text-4xl leading-none text-gold-soft lining-nums sm:text-5xl">
              {{ stat.value }}
            </dd>
          </div>
        }
      </dl>

      <div appReveal="300" class="mt-10">
        <h3 class="mb-4 font-sans text-xs font-bold tracking-[0.25em] text-gold uppercase">
          {{ t().about.genresTitle }}
        </h3>
        <ul class="flex flex-wrap gap-2">
          @for (genre of t().about.genres; track genre) {
            <li class="rounded-full border border-line-strong px-4 py-1.5 text-sm text-ivory/90">
              {{ genre }}
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
