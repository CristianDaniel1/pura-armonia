<div
  appReveal
  class="relative overflow-hidden rounded-3xl border border-line bg-linear-135 from-wine/40 via-surface to-navy/40 p-8 sm:p-12"
>
  <div class="flex flex-col gap-10 lg:flex-row lg:items-center lg:justify-between">
    <h3 class="max-w-xs text-4xl italic">{{ t().events.stepsTitle }}</h3>

    <ol class="grid flex-1 gap-8 sm:grid-cols-3 lg:max-w-3xl">
      @for (step of t().events.steps; track step.title; let i = $index) {
        <li>
          <span class="font-display text-5xl text-gold/70">0{{ i + 1 }}</span>
          <p class="mt-2 font-bold text-ivory">{{ step.title }}</p>
          <p class="mt-1 text-sm text-muted">{{ step.text }}</p>
        </li>
      }
    </ol>
  </div>

  <a href="#contact" class="btn btn-gold mt-10">
    {{ t().nav.cta }}
    <app-icon name="arrow" class="size-4" />
  </a>
</div>
