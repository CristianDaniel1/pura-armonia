<div
  class="relative aspect-video overflow-hidden rounded-2xl bg-surface shadow-2xl shadow-black/60 ring-1 ring-line"
>
  @if (playing()) {
    <iframe
      class="absolute inset-0 size-full"
      [src]="embedUrl()"
      [title]="title()"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
      "
      allowfullscreen
    ></iframe>
  } @else {
    <button
      type="button"
      class="group absolute inset-0 size-full"
      [attr.aria-label]="playLabel() + ': ' + title()"
      (click)="play()"
    >
      <img
        [src]="thumbnail()"
        alt=""
        loading="lazy"
        class="size-full object-cover transition duration-700 ease-elegant group-hover:scale-105"
      />
      <span
        class="absolute inset-0 bg-linear-to-t from-night/80 via-night/10 to-transparent"
      ></span>
      <span
        class="absolute top-1/2 left-1/2 flex size-20 -translate-1/2 items-center justify-center rounded-full bg-wine-bright/90 text-white shadow-[0_0_0_10px_rgb(196_49_79/0.25)] transition duration-500 ease-elegant group-hover:scale-110 group-hover:shadow-[0_0_0_16px_rgb(196_49_79/0.2)] sm:size-24"
      >
        <app-icon name="play" class="ml-1 size-8" />
      </span>
    </button>
  }
</div>
