<a
  [href]="url()"
  target="_blank"
  rel="noopener"
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-line bg-surface transition duration-500 ease-elegant hover:-translate-y-1 hover:border-gold/50 hover:shadow-2xl hover:shadow-black/50"
>
  <div class="relative aspect-video overflow-hidden">
    <img
      [src]="thumbnail()"
      alt=""
      loading="lazy"
      class="size-full object-cover transition duration-700 ease-elegant group-hover:scale-105"
    />
    <span class="absolute inset-0 bg-night/30 transition group-hover:bg-night/10"></span>
    <span
      class="absolute top-1/2 left-1/2 flex size-14 -translate-1/2 scale-90 items-center justify-center rounded-full bg-wine-bright/90 text-white opacity-0 transition duration-500 ease-elegant group-hover:scale-100 group-hover:opacity-100"
    >
      <app-icon name="play" class="ml-0.5 size-6" />
    </span>
    <span
      class="absolute top-3 left-3 rounded-full bg-night/80 px-2.5 py-1 text-[0.7rem] font-bold tracking-wider text-gold backdrop-blur"
    >
      {{ video().year }}
    </span>
  </div>

  <div class="flex flex-1 items-start justify-between gap-4 p-5">
    <div>
      <h3 class="font-display text-2xl leading-tight text-ivory">{{ video().title }}</h3>
      <p class="mt-1 text-sm text-dim">{{ subtitle() }}</p>
      <span class="sr-only">{{ t().newTab }}</span>
    </div>
    <app-icon name="external" class="mt-1.5 size-4 text-dim transition group-hover:text-gold" />
  </div>
</a>
