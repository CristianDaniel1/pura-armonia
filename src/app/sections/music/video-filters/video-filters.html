<div class="flex flex-wrap gap-2" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.id) {
    <button
      type="button"
      class="rounded-full border px-5 py-2 text-sm font-semibold transition duration-300"
      [class]="
        active() === option.id
          ? 'border-gold bg-gold text-[#1a1408]'
          : 'border-line-strong text-muted hover:border-gold hover:text-ivory'
      "
      [attr.aria-pressed]="active() === option.id"
      (click)="changed.emit(option.id)"
    >
      {{ option.label }}
    </button>
  }
</div>
