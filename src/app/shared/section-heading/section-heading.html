<header
  appReveal
  class="mb-12 max-w-2xl md:mb-16"
  [class.mx-auto]="center()"
  [class.text-center]="center()"
>
  <p class="eyebrow">{{ eyebrow() }}</p>
  <h2 class="section-title">
    {{ title().text }} <em>{{ title().highlight }}</em>
  </h2>
  @if (lead()) {
    <p class="section-lead">{{ lead() }}</p>
  }
</header>
